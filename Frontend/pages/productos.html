<!doctype html>
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockApp - Gestión de Inventario</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="stock-module">
    <nav class="navbar navbar-dark bg-surface shadow-sm mb-4">
      <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold text-info" href="../index.html">
          📦 STOCKAPP
          <span class="text-light fw-normal fs-6 ms-2"
            >| Gestión de Inventario</span
          >
        </a>
        <a href="../index.html" class="btn btn-outline-light btn-sm"
          >Volver al Panel</a
        >
      </div>
    </nav>

    <div class="container-fluid px-4 pb-5">
      <div class="row g-4">
        <div class="col-lg-4">
          <div class="bg-surface p-4 shadow-sm border-subtle">
            <h5 class="text-uppercase text-secondary fs-6 fw-bold mb-4">
              <span class="text-info me-2">—</span> Agregar / Editar
            </h5>

            <form id="product-form">
              <input type="hidden" id="editing-id" />

              <div class="mb-3">
                <label class="form-label text-secondary small text-uppercase"
                  >Nombre del Producto</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="name"
                  placeholder="Ej: Teclado Mecánico"
                  required
                />
              </div>

              <div class="mb-3">
                <label class="form-label text-secondary small text-uppercase"
                  >Categoría</label
                >
                <select class="form-select" id="category" required>
                  <option value="" disabled selected>Seleccioná...</option>
                </select>
              </div>

              <div class="row mb-4">
                <div class="col-6">
                  <label class="form-label text-secondary small text-uppercase"
                    >Precio ($)</label
                  >
                  <input
                    type="number"
                    step="0.01"
                    class="form-control"
                    id="price"
                    placeholder="Ej: 45000"
                    required
                  />
                </div>
                <div class="col-6">
                  <label class="form-label text-secondary small text-uppercase"
                    >Cantidad</label
                  >
                  <input
                    type="number"
                    class="form-control"
                    id="quantity"
                    placeholder="Ej: 15"
                    required
                  />
                </div>
              </div>

              <button
                type="submit"
                class="btn btn-info w-100 fw-bold text-dark py-2"
              >
                GUARDAR PRODUCTO
              </button>
            </form>
          </div>
        </div>

        <div class="col-lg-8">
          <div class="bg-surface p-4 shadow-sm border-subtle h-100">
            <h5 class="text-uppercase text-secondary fs-6 fw-bold mb-4">
              <span class="text-info me-2">—</span> Inventario Actual
            </h5>

            <div
              id="products-container"
              class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3"
            >
              <div class="col text-muted small">Cargando inventario...</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/productos.js"></script>
  </body>
</html>
