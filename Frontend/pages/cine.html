<!doctype html>
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineApp - Gestión de Películas</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="cine-module">
    <nav class="navbar navbar-dark bg-surface shadow-sm mb-4">
      <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold text-warning" href="../index.html">
          🎬 CINEAPP
          <span class="text-light fw-normal fs-6 ms-2"
            >| Gestión de Películas</span
          >
        </a>
        <a href="../index.html" class="btn btn-outline-light btn-sm"
          >Volver al Panel</a
        >
      </div>
    </nav>

    <div class="container-fluid px-4 pb-5">
      <div class="row g-4">
        <div class="col-lg-4">
          <div class="bg-surface p-4 shadow-sm border-subtle">
            <h5 class="text-uppercase text-secondary fs-6 fw-bold mb-4">
              <span class="text-warning me-2">—</span> Agregar / Editar
            </h5>

            <form id="movie-form">
              <input type="hidden" id="editing-id" />
              <div class="mb-3">
                <label class="form-label text-secondary small text-uppercase"
                  >Título</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="title"
                  placeholder="Ej: Interstellar"
                  required
                />
              </div>

              <div class="row mb-3">
                <div class="col-6">
                  <label class="form-label text-secondary small text-uppercase"
                    >Director</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="director"
                    placeholder="Ej: Nolan"
                    required
                  />
                </div>
                <div class="col-6">
                  <label class="form-label text-secondary small text-uppercase"
                    >Género</label
                  >
                  <select class="form-select" id="genre" required>
                    <option value="" disabled selected>Seleccioná...</option>
                  </select>
                </div>
              </div>

              <div class="row mb-3">
                <div class="col-6">
                  <label class="form-label text-secondary small text-uppercase"
                    >Año</label
                  >
                  <input
                    type="number"
                    class="form-control"
                    id="year"
                    placeholder="Ej: 2014"
                    required
                  />
                </div>
                <div class="col-6">
                  <label class="form-label text-secondary small text-uppercase"
                    >Duración (min)</label
                  >
                  <input
                    type="number"
                    class="form-control"
                    id="duration"
                    placeholder="Ej: 169"
                    required
                  />
                </div>
              </div>

              <div class="mb-4">
                <label class="form-label text-secondary small text-uppercase"
                  >Sinopsis</label
                >
                <textarea
                  class="form-control"
                  id="synopsis"
                  rows="3"
                  placeholder="Breve sinopsis..."
                  required
                ></textarea>
              </div>

              <button
                type="submit"
                class="btn btn-warning w-100 fw-bold text-dark py-2"
              >
                AGREGAR PELÍCULA
              </button>
            </form>
          </div>
        </div>

        <div class="col-lg-8">
          <div class="bg-surface p-4 shadow-sm border-subtle h-100">
            <h5 class="text-uppercase text-secondary fs-6 fw-bold mb-4">
              <span class="text-warning me-2">—</span> Catálogo
            </h5>

            <div
              id="movies-container"
              class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3"
            >
              <div class="col text-muted small">Cargando películas...</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/cine.js"></script>
  </body>
</html>
