<!doctype html>
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel Principal - Sistema de Gestión</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="d-flex align-items-center min-vh-100">
    <div class="container text-center">
      <h1 class="mb-2 fw-bold display-4">Panel de Control</h1>
      <p class="text-secondary mb-5 fs-5">
        Seleccioná el módulo que deseás administrar
      </p>

      <div class="row justify-content-center gap-4">
        <div class="col-md-5">
          <div class="card border-0 shadow-lg hover-card h-100 p-4">
            <div class="card-body">
              <div class="display-1 mb-3">🎬</div>
              <h3 class="card-title fw-bold">Gestión de Cine</h3>
              <p class="card-text text-secondary mb-4">
                Administrá películas, géneros y el catálogo del cine.
              </p>
              <a
                href="./pages/cine.html"
                class="btn btn-warning btn-lg w-100 fw-bold text-dark"
              >
                Entrar al Cine
              </a>
            </div>
          </div>
        </div>

        <div class="col-md-5">
          <div class="card border-0 shadow-lg hover-card h-100 p-4">
            <div class="card-body">
              <div class="display-1 mb-3">📦</div>
              <h3 class="card-title fw-bold">Gestión de Stock</h3>
              <p class="card-text text-secondary mb-4">
                Administrá el inventario, categorías y precios de los productos.
              </p>
              <a
                href="./pages/productos.html"
                class="btn btn-info btn-lg w-100 fw-bold text-dark"
              >
                Entrar al Stock
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
